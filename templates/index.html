<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</head>
<body>
    <div class="gradient-mesh"></div>

    <div class="container">
        <header>
            <div class="brand">
                <div class="brand-icon">✦</div>
                <div>
                    <h1>Resonance</h1>
                    <p>Upload a video · detect the vibe · find the track</p>
                </div>
            </div>
            <div class="spotify-auth" id="spotifyAuth"></div>
        </header>

        <div class="upload-zone" id="uploadZone">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="16" rx="2"/>
                    <path d="M2 12h20"/>
                    <path d="M7 6V2"/>
                    <path d="M12 6V2"/>
                    <path d="M17 6V2"/>
                    <path d="M2 9l5-3"/>
                    <path d="M9 9l5-3"/>
                    <path d="M16 9l5-3"/>
                </svg>
            </div>
            <h2>Drop your video here</h2>
            <p>MP4 &nbsp;·&nbsp; up to 500 MB</p>
            <input type="file" id="fileInput" accept=".mp4,video/mp4">
            <div class="file-selected" id="fileName"></div>
        </div>

        <button class="analyze-btn" id="analyzeBtn">✦ &nbsp;Analyze Vibe</button>
        <div class="error-msg" id="errorMsg"></div>

        <div class="loading" id="loading">
            <div class="loading-inner">
                <div class="waveform">
                    <div class="bar wave-bar-1"></div>
                    <div class="bar wave-bar-2"></div>
                    <div class="bar wave-bar-3"></div>
                    <div class="bar wave-bar-4"></div>
                    <div class="bar wave-bar-5"></div>
                    <div class="bar wave-bar-6"></div>
                    <div class="bar wave-bar-7"></div>
                    <div class="bar wave-bar-4"></div>
                    <div class="bar wave-bar-5"></div>
                    <div class="bar wave-bar-2"></div>
                    <div class="bar wave-bar-3"></div>
                    <div class="bar wave-bar-1"></div>
                    <div class="bar wave-bar-6"></div>
                </div>
                <div class="status" id="statusText">Starting...</div>
                <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>
        </div>

        <div class="results" id="results">

            <div class="glass fade-in fade-in-1">
                <div class="section-label">
                    <div class="section-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="2.2" stroke-linecap="round">
                            <line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="14" y2="17"/>
                        </svg>
                    </div>
                    <span class="section-label-text">Transcript</span>
                </div>
                <div class="transcript-text" id="transcriptText"></div>
            </div>

            <div class="glass fade-in fade-in-2">
                <div class="section-label">
                    <div class="section-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L14 10L22 12L14 14L12 22L10 14L2 12L10 10Z"/>
                        </svg>
                    </div>
                    <span class="section-label-text">Vibe Read</span>
                </div>
                <div class="vibe-read" id="vibeRead"></div>
            </div>

            <div class="glass fade-in fade-in-3" id="playerSection" style="display:none">
                <div class="section-label">
                    <div class="section-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                    </div>
                    <span class="section-label-text">Player</span>
                </div>
                <video id="videoPlayer" controls></video>
                <div class="volume-controls">
                    <div class="volume-row">
                        <span class="vol-label">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>
                            </svg>
                            Video
                        </span>
                        <input type="range" class="vol-slider" id="videoVolume" min="0" max="1" step="0.01" value="1">
                        <span class="vol-pct" id="videoVolPct">100%</span>
                    </div>
                    <div class="volume-row">
                        <span class="vol-label">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                            </svg>
                            Music
                        </span>
                        <input type="range" class="vol-slider" id="musicVolume" min="0" max="1" step="0.01" value="1">
                        <span class="vol-pct" id="musicVolPct">100%</span>
                    </div>
                    <div class="volume-row" id="songScrubRow" style="display:none">
                        <span class="vol-label">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="12" x2="21" y2="12"/><circle cx="8" cy="12" r="2.5" fill="rgba(255,255,255,0.75)" stroke="none"/>
                            </svg>
                            Song
                        </span>
                        <input type="range" class="vol-slider" id="songScrubber" min="0" max="1000" step="1" value="0">
                        <span class="vol-pct" id="songTime" style="min-width:76px">0:00 / 0:00</span>
                    </div>
                </div>
                <div id="embed-iframe"></div>
                <div id="exportArea" style="display:none; margin-top:14px">
                    <button class="reroll-btn" id="exportTriggerBtn">&#11015;&nbsp;&nbsp;Export with Instrumental</button>
                    <div id="exportSettings" style="display:none; margin-top:10px; padding:12px 14px; border:1px solid rgba(255,255,255,0.1); border-radius:10px; background:rgba(255,255,255,0.04)">
                        <div class="volume-row" style="margin-bottom:6px">
                            <span class="vol-label" style="min-width:116px">Song starts at</span>
                            <input type="range" class="vol-slider" id="exportScrubber" min="0" max="1000" step="1" value="0">
                            <span class="vol-pct" id="exportScrubTime" style="min-width:76px">0:00 / 0:00</span>
                        </div>
                        <div class="volume-row" style="margin-bottom:6px">
                            <span class="vol-label" style="min-width:116px">Video audio</span>
                            <input type="range" class="vol-slider" id="exportVideoVol" min="0" max="1" step="0.01" value="1">
                            <span class="vol-pct" id="exportVideoVolPct">100%</span>
                        </div>
                        <div class="volume-row" style="margin-bottom:12px">
                            <span class="vol-label" style="min-width:116px">Instrumental</span>
                            <input type="range" class="vol-slider" id="exportMusicVol" min="0" max="1" step="0.01" value="0.8">
                            <span class="vol-pct" id="exportMusicVolPct">80%</span>
                        </div>
                        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
                            <button class="reroll-btn" id="exportCancelBtn">Cancel</button>
                            <button class="reroll-btn" id="exportConfirmBtn">&#11015;&nbsp;&nbsp;Confirm &amp; Export</button>
                            <span id="exportStatus" style="font-size:0.82rem; opacity:0.7; flex:1"></span>
                        </div>
                        <div class="progress-bar" id="exportProgressBar" style="display:none; margin-top:8px">
                            <div class="progress-fill" id="exportProgressFill"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass fade-in fade-in-4">
                <div class="section-label" style="justify-content:space-between">
                    <div style="display:flex;align-items:center;gap:10px">
                        <div class="section-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                            </svg>
                        </div>
                        <span class="section-label-text">Suggested Songs</span>
                    </div>
                    <button class="reroll-btn" id="rerollBtn" style="display:none">&#8635;&nbsp;&nbsp;5 more</button>
                </div>
                <div class="tracks-grid" id="tracksGrid"></div>
            </div>

            <button class="reset-btn" id="resetBtn">&#8617; &nbsp;Analyze another video</button>
        </div>
    </div>

    <script>
        const token = "{{ spotify_token }}";

        // dB caps: video -6 dB ≈ 0.501, music -12 dB ≈ 0.251
        const VIDEO_MAX = Math.pow(10, -6  / 20);
        const MUSIC_MAX = Math.pow(10, -12 / 20);

        let spotifyPlayer   = null;
        let spotifyDeviceId = null;
        let currentUri      = null;
        let currentPlayBtn  = null;
        let videoBlobUrl    = null;
        let lastTranscript  = null;
        let lastDuration    = null;
        let lastVideoId     = null;
        let currentSongName   = '';
        let currentSongArtist = '';
        let excludedTracks  = new Set();
        let audioCtx        = null;
        let videoGainNode   = null;
        const videoEl = document.getElementById('videoPlayer');

        // ── Render auth header ──────────────────────────────────────────
        document.getElementById('spotifyAuth').innerHTML = token
            ? `<span class="connected-status">&#10003; Spotify Connected</span>
               <a href="/logout" class="logout-btn">Disconnect</a>`
            : `<a href="/login" class="connect-btn">Connect Spotify</a>`;

        // ── Spotify Web Playback SDK ────────────────────────────────────
        window.onSpotifyWebPlaybackSDKReady = () => {
            if (!token) return;
            spotifyPlayer = new Spotify.Player({
                name: 'Video Vibe',
                getOAuthToken: cb => cb(token),
                volume: MUSIC_MAX,
            });
            spotifyPlayer.addListener('ready', ({ device_id }) => {
                spotifyDeviceId = device_id;
            });
            spotifyPlayer.addListener('player_state_changed', state => {
                if (!state || !currentPlayBtn) return;
                currentPlayBtn.innerHTML = state.paused ? '&#9654;' : '&#9646;&#9646;';
            });
            spotifyPlayer.connect();
        };

        // ── Web Audio for video ─────────────────────────────────────────
        function initAudio() {
            if (audioCtx) { audioCtx.resume(); return; }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const src = audioCtx.createMediaElementSource(videoEl);
            videoGainNode = audioCtx.createGain();
            videoGainNode.gain.value = VIDEO_MAX * parseFloat(videoVolSlider.value);
            src.connect(videoGainNode);
            videoGainNode.connect(audioCtx.destination);
        }
        // ── Sync video play/pause with Spotify ──────────────────────────
        let syncingPlayback = false;

        videoEl.addEventListener('play', async () => {
            initAudio();
            if (syncingPlayback || !currentUri || !spotifyPlayer) return;
            syncingPlayback = true;
            try { await spotifyPlayer.resume(); } catch {}
            syncingPlayback = false;
            startSeekPoll();
        });

        videoEl.addEventListener('pause', async () => {
            if (syncingPlayback || !currentUri || !spotifyPlayer) return;
            syncingPlayback = true;
            try { await spotifyPlayer.pause(); } catch {}
            syncingPlayback = false;
        });

        // ── Volume sliders ──────────────────────────────────────────────
        const videoVolSlider = document.getElementById('videoVolume');
        const musicVolSlider = document.getElementById('musicVolume');
        const videoVolPct    = document.getElementById('videoVolPct');
        const musicVolPct    = document.getElementById('musicVolPct');

        videoVolSlider.addEventListener('input', () => {
            const v = parseFloat(videoVolSlider.value);
            if (videoGainNode) videoGainNode.gain.value = VIDEO_MAX * v;
            videoVolPct.textContent = Math.round(v * 100) + '%';
        });
        musicVolSlider.addEventListener('input', () => {
            const v = parseFloat(musicVolSlider.value);
            if (spotifyPlayer) spotifyPlayer.setVolume(MUSIC_MAX * v);
            musicVolPct.textContent = Math.round(v * 100) + '%';
        });

        // ── Song scrubber ────────────────────────────────────────────────
        let songDurationMs = 0;
        let isSeeking      = false;
        let seekPollTimer  = null;
        const songScrubRow = document.getElementById('songScrubRow');
        const songScrubber = document.getElementById('songScrubber');
        const songTime     = document.getElementById('songTime');

        function formatTime(ms) {
            const s = Math.floor(ms / 1000);
            return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        }

        function startSeekPoll() {
            if (seekPollTimer) return;
            seekPollTimer = setInterval(async () => {
                if (isSeeking || !spotifyPlayer || !currentUri) return;
                const state = await spotifyPlayer.getCurrentState().catch(() => null);
                if (!state) return;
                const pos = state.position;
                const dur = state.duration || songDurationMs;
                if (dur > 0) {
                    songScrubber.value = Math.round((pos / dur) * 1000);
                    songTime.textContent = formatTime(pos) + ' / ' + formatTime(dur);
                }
            }, 500);
        }

        function stopSeekPoll() {
            clearInterval(seekPollTimer);
            seekPollTimer = null;
        }

        songScrubber.addEventListener('mousedown',  () => { isSeeking = true; });
        songScrubber.addEventListener('touchstart', () => { isSeeking = true; }, { passive: true });
        songScrubber.addEventListener('input', () => {
            if (songDurationMs > 0) {
                const pos = (parseInt(songScrubber.value) / 1000) * songDurationMs;
                songTime.textContent = formatTime(pos) + ' / ' + formatTime(songDurationMs);
            }
        });
        songScrubber.addEventListener('change', async () => {
            isSeeking = false;
            if (!spotifyPlayer || !currentUri || songDurationMs <= 0) return;
            const pos = Math.round((parseInt(songScrubber.value) / 1000) * songDurationMs);
            await spotifyPlayer.seek(pos).catch(() => {});
        });

        // ── Export ──────────────────────────────────────────────────────
        const exportArea         = document.getElementById('exportArea');
        const exportTriggerBtn   = document.getElementById('exportTriggerBtn');
        const exportSettings     = document.getElementById('exportSettings');
        const exportScrubber     = document.getElementById('exportScrubber');
        const exportScrubTime    = document.getElementById('exportScrubTime');
        const exportVideoVol     = document.getElementById('exportVideoVol');
        const exportVideoVolPct  = document.getElementById('exportVideoVolPct');
        const exportMusicVol     = document.getElementById('exportMusicVol');
        const exportMusicVolPct  = document.getElementById('exportMusicVolPct');
        const exportCancelBtn    = document.getElementById('exportCancelBtn');
        const exportConfirmBtn   = document.getElementById('exportConfirmBtn');
        const exportStatus       = document.getElementById('exportStatus');
        const exportProgressBar  = document.getElementById('exportProgressBar');
        const exportProgressFill = document.getElementById('exportProgressFill');

        exportScrubber.addEventListener('input', () => {
            if (songDurationMs > 0) {
                const pos = (parseInt(exportScrubber.value) / 1000) * songDurationMs;
                exportScrubTime.textContent = formatTime(pos) + ' / ' + formatTime(songDurationMs);
            }
        });
        exportVideoVol.addEventListener('input', () => {
            exportVideoVolPct.textContent = Math.round(parseFloat(exportVideoVol.value) * 100) + '%';
        });
        exportMusicVol.addEventListener('input', () => {
            exportMusicVolPct.textContent = Math.round(parseFloat(exportMusicVol.value) * 100) + '%';
        });

        // Open settings panel, pre-fill from current playback state
        exportTriggerBtn.addEventListener('click', () => {
            exportScrubber.value = songScrubber.value;
            const pos = songDurationMs > 0
                ? (parseInt(exportScrubber.value) / 1000) * songDurationMs : 0;
            exportScrubTime.textContent = formatTime(pos) + ' / ' + formatTime(songDurationMs);
            exportVideoVol.value = videoVolSlider.value;
            exportVideoVolPct.textContent = Math.round(parseFloat(videoVolSlider.value) * 100) + '%';
            exportMusicVol.value = musicVolSlider.value;
            exportMusicVolPct.textContent = Math.round(parseFloat(musicVolSlider.value) * 100) + '%';
            exportStatus.textContent = '';
            exportProgressBar.style.display = 'none';
            exportProgressFill.style.width = '0%';
            exportConfirmBtn.disabled = false;
            exportCancelBtn.disabled = false;
            exportSettings.style.display = 'block';
        });

        exportCancelBtn.addEventListener('click', () => {
            exportSettings.style.display = 'none';
        });

        exportConfirmBtn.addEventListener('click', async () => {
            if (!lastVideoId || !currentUri) return;

            const start_ms  = songDurationMs > 0
                ? Math.round((parseInt(exportScrubber.value) / 1000) * songDurationMs)
                : 0;
            const video_vol = parseFloat(exportVideoVol.value);
            const music_vol = parseFloat(exportMusicVol.value);

            exportConfirmBtn.disabled = true;
            exportCancelBtn.disabled  = true;
            exportProgressBar.style.display = 'block';
            exportProgressFill.style.width = '0%';
            exportStatus.textContent = '';

            try {
                const resp = await fetch('/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_id:  lastVideoId,
                        song_name: currentSongName,
                        artist:    currentSongArtist,
                        start_ms,
                        video_vol,
                        music_vol,
                    }),
                });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    exportStatus.textContent = err.error || 'Export failed.';
                    exportConfirmBtn.disabled = false;
                    exportCancelBtn.disabled  = false;
                    exportProgressBar.style.display = 'none';
                    return;
                }

                const reader  = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();
                    for (const part of parts) {
                        if (!part.startsWith('data: ')) continue;
                        const event = JSON.parse(part.slice(6));
                        if (event.error) {
                            exportStatus.textContent = 'Error: ' + event.error;
                            exportConfirmBtn.disabled = false;
                            exportCancelBtn.disabled  = false;
                            exportProgressBar.style.display = 'none';
                            return;
                        }
                        if (event.message) exportStatus.textContent = event.message;
                        if (event.progress != null) exportProgressFill.style.width = event.progress + '%';
                        if (event.done) {
                            setTimeout(() => {
                                exportProgressBar.style.display = 'none';
                                exportProgressFill.style.width = '0%';
                                exportStatus.innerHTML = `<a href="/download/${event.export_id}" style="color:rgba(255,255,255,0.9);text-decoration:underline;font-weight:500">&#11015; Download ready — click to save</a>`;
                                exportConfirmBtn.disabled = false;
                                exportCancelBtn.disabled  = false;
                            }, 300);
                            return;
                        }
                    }
                }
            } catch {
                exportStatus.textContent = 'Export failed — is the server running?';
                exportConfirmBtn.disabled = false;
                exportCancelBtn.disabled  = false;
                exportProgressBar.style.display = 'none';
            }
        });

        // ── Upload ──────────────────────────────────────────────────────
        const uploadZone = document.getElementById('uploadZone');
        const fileInput  = document.getElementById('fileInput');
        const fileName   = document.getElementById('fileName');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading    = document.getElementById('loading');
        const statusText = document.getElementById('statusText');
        const errorMsg   = document.getElementById('errorMsg');
        const results    = document.getElementById('results');
        const resetBtn   = document.getElementById('resetBtn');
        let selectedFile = null;

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault(); uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files[0]) selectFile(fileInput.files[0]); });

        function selectFile(file) {
            if (!file.name.toLowerCase().endsWith('.mp4')) { showError('Please select an MP4 video file.'); return; }
            if (file.size > 500 * 1024 * 1024) { showError('File too large. Max 500MB.'); return; }
            selectedFile = file;
            if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
            videoBlobUrl = URL.createObjectURL(file);
            fileName.textContent = file.name + ' (' + (file.size / 1048576).toFixed(1) + ' MB)';
            analyzeBtn.style.display = 'block';
            hideError();
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';
            hideError();

            const progressFill = document.querySelector('.progress-fill');
            progressFill.style.width = '0%';
            statusText.textContent = 'Starting\u2026';

            try {
                const fd = new FormData();
                fd.append('video', selectedFile);
                const resp = await fetch('/analyze', { method: 'POST', body: fd });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    showError(err.error || 'Something went wrong.');
                    loading.style.display = 'none';
                    analyzeBtn.disabled = false;
                    return;
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();
                    for (const part of parts) {
                        if (!part.startsWith('data: ')) continue;
                        const event = JSON.parse(part.slice(6));
                        if (event.error) {
                            showError(event.error);
                            loading.style.display = 'none';
                            analyzeBtn.disabled = false;
                            progressFill.style.width = '0%';
                            return;
                        }
                        if (event.message) statusText.textContent = event.message;
                        if (event.progress != null) progressFill.style.width = event.progress + '%';
                        if (event.done) {
                            setTimeout(() => {
                                loading.style.display = 'none';
                                progressFill.style.width = '0%';
                                analyzeBtn.disabled = false;
                                renderResults(event);
                            }, 400);
                            return;
                        }
                    }
                }
            } catch {
                showError('Connection failed. Is the server running?');
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
                progressFill.style.width = '0%';
            }
        });

        function renderResults(data) {
            document.getElementById('transcriptText').textContent = data.transcript;
            document.getElementById('vibeRead').textContent = data.vibe_read || '';

            if (videoBlobUrl) {
                videoEl.src = videoBlobUrl;
                document.getElementById('playerSection').style.display = 'block';
            }

            lastTranscript = data.transcript;
            lastDuration   = data.duration || null;
            lastVideoId    = data.video_id  || null;
            excludedTracks = new Set();

            renderTracks(data.tracks);
            document.getElementById('rerollBtn').style.display = 'inline-block';
            results.style.display = 'block';
        }

        function renderTracks(tracks) {
            tracks.forEach(t => excludedTracks.add(t.name));

            const grid = document.getElementById('tracksGrid');
            grid.innerHTML = '';
            for (const track of tracks) {
                const art = track.album_art || '';
                grid.innerHTML += `<div class="track-card">
                    ${art ? `<img src="${art}" alt="Album art">` : ''}
                    <div class="track-info">
                        <div class="name">${escHtml(track.name)}</div>
                        <div class="artist">${escHtml(track.artist)}</div>
                        <div class="genre">${escHtml(track.genre || '')}</div>
                        <div class="reason">${escHtml(track.reason || '')}</div>
                    </div>
                    <button class="play-btn" data-uri="${track.uri}" data-duration="${track.duration_ms||0}" data-name="${encodeURIComponent(track.name)}" data-artist="${encodeURIComponent(track.artist)}">&#9654;</button>
                </div>`;
            }

            grid.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!token) { showError('Connect Spotify at the top to play songs.'); return; }
                    if (!spotifyDeviceId) { showError('Spotify is initializing — try again in a moment.'); return; }

                    const uri = btn.dataset.uri;
                    if (uri === currentUri) {
                        // Toggle both video and Spotify together
                        syncingPlayback = true;
                        const state = await spotifyPlayer.getCurrentState().catch(() => null);
                        const paused = !state || state.paused;
                        try {
                            if (paused) {
                                await spotifyPlayer.resume();
                                await videoEl.play();
                                startSeekPoll();
                            } else {
                                await spotifyPlayer.pause();
                                videoEl.pause();
                            }
                        } catch {}
                        syncingPlayback = false;
                    } else {
                        // New song selected
                        if (currentPlayBtn) currentPlayBtn.innerHTML = '&#9654;';
                        stopSeekPoll();
                        currentUri        = uri;
                        currentPlayBtn    = btn;
                        songDurationMs    = parseInt(btn.dataset.duration) || 0;
                        currentSongName   = decodeURIComponent(btn.dataset.name   || '');
                        currentSongArtist = decodeURIComponent(btn.dataset.artist || '');
                        btn.innerHTML     = '&#9646;&#9646;';

                        // Show and reset scrubber
                        songScrubRow.style.display = '';
                        songScrubber.value = 0;
                        songTime.textContent = '0:00 / ' + formatTime(songDurationMs);

                        // Show export trigger, collapse any open settings panel
                        exportArea.style.display = 'block';
                        exportSettings.style.display = 'none';
                        exportStatus.textContent = '';
                        exportProgressBar.style.display = 'none';
                        exportProgressFill.style.width = '0%';

                        const playResp = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${spotifyDeviceId}`, {
                            method: 'PUT',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ uris: [uri] }),
                        });
                        if (!playResp.ok) {
                            const err = await playResp.json().catch(() => ({}));
                            showError('Spotify: ' + (err.error?.message || 'Playback failed. Make sure you have Spotify Premium.'));
                            btn.innerHTML = '&#9654;';
                            currentUri = null; currentPlayBtn = null;
                            songScrubRow.style.display = 'none';
                            return;
                        }
                        spotifyPlayer.setVolume(MUSIC_MAX * parseFloat(musicVolSlider.value));
                        syncingPlayback = true;
                        videoEl.currentTime = 0;
                        await videoEl.play().catch(() => {});
                        syncingPlayback = false;
                        startSeekPoll();
                    }
                });
            });
        }

        const rerollBtn = document.getElementById('rerollBtn');
        rerollBtn.addEventListener('click', async () => {
            if (!lastTranscript) return;
            const origHTML = rerollBtn.innerHTML;
            rerollBtn.disabled = true;
            rerollBtn.innerHTML = 'Finding\u2026';
            try {
                const resp = await fetch('/reroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript: lastTranscript, duration: lastDuration, exclude: [...excludedTracks] }),
                });
                const data = await resp.json();
                if (!resp.ok) { showError(data.error || 'Reroll failed.'); return; }
                renderTracks(data.tracks);
            } catch {
                showError('Reroll failed — is the server running?');
            } finally {
                rerollBtn.disabled = false;
                rerollBtn.innerHTML = origHTML;
            }
        });

        function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function showError(m) { errorMsg.textContent = m; errorMsg.style.display = 'block'; }
        function hideError() { errorMsg.style.display = 'none'; }

        resetBtn.addEventListener('click', () => {
            stopSeekPoll();
            if (spotifyPlayer) spotifyPlayer.pause();
            if (currentPlayBtn) { currentPlayBtn.innerHTML = '&#9654;'; currentPlayBtn = null; }
            currentUri        = null;
            currentSongName   = '';
            currentSongArtist = '';
            songDurationMs    = 0;
            songScrubRow.style.display = 'none';
            songScrubber.value = 0;
            videoEl.pause(); videoEl.src = '';
            document.getElementById('playerSection').style.display = 'none';
            results.style.display = 'none';
            selectedFile = null;
            if (videoBlobUrl) { URL.revokeObjectURL(videoBlobUrl); videoBlobUrl = null; }
            fileName.textContent = '';
            analyzeBtn.style.display = 'none';
            fileInput.value = '';
            lastTranscript = null;
            lastDuration   = null;
            excludedTracks = new Set();
            document.getElementById('rerollBtn').style.display = 'none';
            // Clean up video file on server
            if (lastVideoId) {
                fetch('/cleanup/' + lastVideoId, { method: 'POST' }).catch(() => {});
                lastVideoId = null;
            }
            exportArea.style.display = 'none';
            exportSettings.style.display = 'none';
            exportStatus.textContent = '';
            exportProgressBar.style.display = 'none';
            exportProgressFill.style.width = '0%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
